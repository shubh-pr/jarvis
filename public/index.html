<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JARVIS</title>
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <div id="login-screen">
      <h1>JARVIS</h1>
      <input id="passcode-input" type="password" inputmode="text" placeholder="Passcode" autocomplete="off" />
      <button id="login-btn">Unlock</button>
      <div id="login-error"></div>
    </div>

    <div id="chat-screen" class="hidden">
      <header>
        <div class="header-left">
          <button id="back-btn" class="hidden" aria-label="All projects">‹</button>
          <div>
            <h1 id="view-title">JARVIS</h1>
            <div id="view-sub" class="hidden"></div>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button id="search-btn" aria-label="Search history" title="Search history">🔍</button>
          <button id="history-btn" class="hidden">History</button>
          <button id="enable-push-btn" class="hidden" title="Enable notifications">Notify</button>
          <span id="conn-status" class="disconnected">connecting…</span>
        </div>
      </header>
      <!-- Anything that needs you, from any project, stays visible on every screen. -->
      <div id="waiting-strip" class="hidden"></div>
      <div id="search-panel" class="hidden">
        <input id="search-input" type="search" placeholder="Search all conversations…" autocomplete="off" />
        <div id="search-scope"></div>
        <div id="search-results"></div>
      </div>
      <div id="home-view">
        <div id="project-list"></div>
        <div id="home-feed"></div>
      </div>
      <div id="project-view" class="hidden">
        <div id="history-panel" class="hidden">
          <div id="history-filters"></div>
          <div id="block-list"></div>
        </div>
        <div id="viewing-bar" class="hidden"></div>
        <div id="messages"></div>
      </div>
      <div id="queue-panel" class="hidden"></div>
      <div id="reply-target" class="hidden">
        <span id="reply-target-label"></span>
        <button id="reply-target-clear" aria-label="Clear reply target">✕</button>
      </div>
      <div id="mic-note" class="hidden"></div>
      <div id="composer">
        <button id="mic-btn" aria-label="Speak instead of typing">🎤</button>
        <input id="msg-input" type="text" placeholder="Message…" autocomplete="off" />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
