<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JARVIS</title>
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <div id="login-screen">
      <h1>JARVIS</h1>
      <input id="passcode-input" type="password" inputmode="text" placeholder="Passcode" autocomplete="off" />
      <button id="login-btn">Unlock</button>
      <div id="login-error"></div>
    </div>

    <div id="chat-screen" class="hidden">
      <header>
        <h1>JARVIS</h1>
        <div style="display:flex; align-items:center; gap:8px;">
          <button id="enable-push-btn" class="hidden">Enable notifications</button>
          <span id="conn-status" class="disconnected">connecting…</span>
        </div>
      </header>
      <div id="messages"></div>
      <div id="queue-panel" class="hidden"></div>
      <div id="reply-target" class="hidden">
        <span id="reply-target-label"></span>
        <button id="reply-target-clear" aria-label="Clear reply target">✕</button>
      </div>
      <div id="composer">
        <input id="msg-input" type="text" placeholder="Message…" autocomplete="off" />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
